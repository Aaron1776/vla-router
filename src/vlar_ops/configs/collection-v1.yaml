# Data-collection and evaluation choices (docs/SPEC.md §7, §9, §10, §12).
# Not part of the frozen harness: changing these changes which jobs run, not how a job runs.

schema: 1

# Two seeds per episode (SPEC §3). The scene seed is not chosen here: the harness sets it from the
# initial state (142 + k; 1000 + k only for the π0.5 parity run, harness option `scene_seed`).
# Rollout seeds are namespace + 100 * task_id + init_idx. The namespaces are disjoint, so the base,
# exploration, DAgger and evaluation runs of one task and initial state never share a rollout seed and
# evaluation's are never used in data collection. Every evaluated method and baseline uses the same
# `eval` rollout seed for a given task and initial state, so per-episode results pair up (SPEC §10).
rollout_seed_namespaces:
  base: 1000000
  explore: 2000000
  dagger: 3000000
  pi05_parity: 5000000
  eval: 7000000

exploration:
  episodes_per_state: 1       # [ASSUMPTION] 500 episodes
  p_escalate: 0.1             # [ASSUMPTION] per decision, while budget remains

branches:
  seeds: 3                    # §12 reduction step 5 lowers this to 2
  enabled: [b1_continue, b2_one_call, b3_three_calls, b4_max]   # §12 reduction step 2 drops b3
  # Graceful-stop tiers (§12): 1 = first two seeds of b1, b2, b4; 2 = their later seeds; 3 = b3.
  tier_one_seeds: 2

dp_sampling:
  fraction: null              # set from the pilot's measured throughput (§12)
  seed: 20261120              # recorded with every plan

order_seed: 7                 # shuffles episode and decision-point order inside each plan
