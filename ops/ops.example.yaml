# Copy to ops/ops.yaml (git-ignored) on the VM and point VLAR_OPS_CONFIG at it.
storage_url: gs://REPLACE-WITH-BUCKET/vla-router
local_root: /var/lib/vlar          # queue database, local copies of results, STOP flag

spend:
  soft_limit_usd: 40               # one notification (log-based alert -> email)
  hard_limit_usd: 45               # stop new jobs, drain, sync, shut down
  vm_hourly_usd: 0.472             # g2-standard-16 Spot incl. its L4 (0.472 measured 2026-11-24): check the price before each start
  boot_allowance_s: 180            # billed time before the kernel starts (sessions count from boot)
  storage_usd_per_gb_month: 0.020  # Standard storage, regional: check for your region
  tick_s: 60
  storage_scan_every_s: 1800
  drain_grace_s: 900

shutdown_command: ["sudo", "shutdown", "-h", "now"]
